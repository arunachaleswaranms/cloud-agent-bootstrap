# ~/.tmux.conf - managed by cloud-agent-bootstrap
# Re-running bootstrap.sh replaces this file only if this header is present;
# otherwise your custom ~/.tmux.conf is backed up to ~/.tmux.conf.bak.<timestamp>.

set -g default-terminal "xterm-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10

# Status bar
set -g status-style "bg=colour235,fg=colour136"
set -g status-right "%Y-%m-%d %H:%M:%S"
set -g status-right-length 50

# Reload config: prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits that inherit the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle windows
bind -r C-h previous-window
bind -r C-l next-window
